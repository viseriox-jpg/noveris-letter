name: Build mod

on:
  push:
    branches: [ main, courier-birds ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Import exact Crop Critters courier models and animations
        shell: bash
        run: |
          set -euo pipefail
          CROP_URL="$(python - <<'PY'
          import json, urllib.request
          expected_sha = '503fe2da6f6184bb99cd2bc0952a87d6632b8a9168ce621016c5c0912c8f02cb'
          versions = json.load(urllib.request.urlopen('https://api.modrinth.com/v2/project/crop-critters/version'))
          for version in versions:
              if version.get('version_number') != '1.5.0':
                  continue
              if '1.21.1' not in version.get('game_versions', []) or 'neoforge' not in version.get('loaders', []):
                  continue
              for file in version.get('files', []):
                  if file.get('hashes', {}).get('sha256') == expected_sha:
                      print(file['url'])
                      raise SystemExit
          raise SystemExit('Could not find the exact uploaded Crop Critters 1.5.0 NeoForge 1.21.1 artifact by SHA-256')
          PY
          )"
          curl -fsSL "$CROP_URL" -o /tmp/cropcritters.jar
          echo "503fe2da6f6184bb99cd2bc0952a87d6632b8a9168ce621016c5c0912c8f02cb  /tmp/cropcritters.jar" | sha256sum -c -
          python tools/import_crop_critter_courier_assets.py /tmp/cropcritters.jar
      - name: Import preserved Sparrow and Barn Owl assets
        shell: bash
        run: |
          set -euo pipefail
          FRIGINZI_URL="$(python - <<'PY'
          import json, urllib.request
          version = json.load(urllib.request.urlopen('https://api.modrinth.com/v2/version/Z0gsHRNS'))
          print(next(item['url'] for item in version['files'] if item.get('primary')))
          PY
          )"
          curl -fsSL "$FRIGINZI_URL" -o /tmp/frikinzis-fauna.jar
          python tools/import_legacy_bird_assets.py /tmp/frikinzis-fauna.jar
      - name: Apply final GUI layout fix
        run: python tools/fix_mail_gui.py
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: noveris-letter-jar
          path: build/libs/*.jar
