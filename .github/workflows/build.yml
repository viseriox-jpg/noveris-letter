name: Build mod

on:
  push:
    branches: [ main, courier-birds ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Import Clutter Bestiary courier models and textures
        shell: bash
        run: |
          set -euo pipefail
          CLUTTER_URL="$(python - <<'PY'
          import json, urllib.request
          version = json.load(urllib.request.urlopen('https://api.modrinth.com/v2/version/L8JTSQfM'))
          print(next(item['url'] for item in version['files'] if item.get('primary')))
          PY
          )"
          curl -fsSL "$CLUTTER_URL" -o /tmp/clutterbestiary.jar
          python tools/import_clutter_courier_assets.py /tmp/clutterbestiary.jar
      - name: Import preserved Sparrow and Barn Owl assets
        shell: bash
        run: |
          set -euo pipefail
          FRIGINZI_URL="$(python - <<'PY'
          import json, urllib.request
          version = json.load(urllib.request.urlopen('https://api.modrinth.com/v2/version/Z0gsHRNS'))
          print(next(item['url'] for item in version['files'] if item.get('primary')))
          PY
          )"
          curl -fsSL "$FRIGINZI_URL" -o /tmp/frikinzis-fauna.jar
          python tools/import_legacy_bird_assets.py /tmp/frikinzis-fauna.jar
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: noveris-letter-jar
          path: build/libs/*.jar
